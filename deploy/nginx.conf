# nginx 反向代理示例。把 fav.example.com 换成你的域名。
# 先只启用第一个 server 块申请证书，拿到证书后再加上第二个。
server {
    listen 80;
    listen [::]:80;
    server_name fav.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / { return 301 https://fav.example.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fav.example.com;
    ssl_certificate /etc/letsencrypt/live/fav.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fav.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 上传截图和文件。比 CF_MAX_UPLOAD_MB 稍大一点
    client_max_body_size 60m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:4170;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # 网页实时刷新用的是 SSE，不能被缓冲
        proxy_buffering off;
        proxy_read_timeout 1h;
        # 大文件直接流给后端，不先存到 nginx 的临时目录
        proxy_request_buffering off;
    }
}
